<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Tipografia Fredoka: gruesa, moderna y muy legible en streaming -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent !important;
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Columna vertical de 3 elementos (uno arriba del otro) */
    .grid-3-vertical {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      justify-items: center;
      align-items: center;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      opacity: 1;
      transform: scale(1);
    }

    .grid-3-vertical.oculto { opacity: 0; transform: scale(0.95); }

    /* Tarjeta horizontal (icono a la izquierda, detalles a la derecha) */
    .item {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      width: 360px;
      gap: 16px;
    }

    .item .img-box {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item .img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0px 8px 14px rgba(0, 0, 0, 0.9));
    }

    .item .info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    /* 1. Nombre del regalo (blanco) */
    .item .titulo {
      color: #ffffff;
      font-weight: 900;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1.1;
      text-shadow:
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 10px rgba(0, 0, 0, 0.95);
      text-align: left;
      margin-bottom: 2px;
    }

    /* 2. Efecto / descripcion (azul aqua) */
    .item .subtitulo {
      color: #00f2fe;
      font-weight: 900;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      line-height: 1.1;
      text-shadow:
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 10px rgba(0, 0, 0, 0.95);
      text-align: left;
      margin-bottom: 4px;
    }

    /* 3. Moneda y precio (dorado) */
    .item .precio-box { display: flex; align-items: center; gap: 6px; }

    .item .precio-box img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.9));
    }

    .item .precio-box span {
      color: #ffea00;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 0.8px;
      line-height: 1;
      text-shadow:
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 10px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="grid-3-vertical" id="contenedor"></div>
  </div>

  <script>
    // REGALOS DE TU MATRIZ (generado por el programa)
    const regalos = [
  {
    "archivo": "regalos/Rose.png",
    "nombre": "Rosa",

    "monedas": 1
  },
  {
    "archivo": "regalos/Wave Firework.png",
    "nombre": "Fuegos Artificiales",
    "descripcion": "Luz roja, luz verde",
    "monedas": 5
  },
  {
    "archivo": "regalos/GG.png",
    "nombre": "GG",
    "descripcion": "Dar una perk",
    "monedas": 1
  },
  {
    "archivo": "regalos/Finger Heart.png",
    "nombre": "Corazòn Coreano",
    "descripcion": "Quitar una perk",
    "monedas": 5
  },
  {
    "archivo": "regalos/Perfume.png",
    "nombre": "Perfume",
    "descripcion": "Aparece jefe",
    "monedas": 20
  },
  {
    "archivo": "regalos/Balloons.png",
    "nombre": "Globos",
    "descripcion": "Quitar todos los puntos",
    "monedas": 10
  },
  {
    "archivo": "regalos/Maracas.png",
    "nombre": "Maracas",
    "descripcion": "Puntos dobles",
    "monedas": 1
  },
  {
    "archivo": "regalos/Woodland Wonder.png",
    "nombre": "Maravilla del Bosque",
    "descripcion": "Pack-a-Punch: bajar arma",
    "monedas": 30
  },
  {
    "archivo": "regalos/White Rose.png",
    "nombre": "Rosa Blanca",
    "descripcion": "Munición máxima",
    "monedas": 1
  },
  {
    "archivo": "regalos/Guardian Wings.png",
    "nombre": "Alas Guardianes",
    "descripcion": "Arma aleatoria",
    "monedas": 1
  },
  {
    "archivo": "regalos/Cake Slice.png",
    "nombre": "Cake Slice",
    "descripcion": "Muerte instantánea",
    "monedas": 1
  },
  {
    "archivo": "regalos/Pop.png",
    "nombre": "Pop",
    "descripcion": "Kaboom",
    "monedas": 1
  },
  {
    "archivo": "regalos/Love you so much.png",
    "nombre": "Te Adoro",
    "descripcion": "Powerup aleatorio",
    "monedas": 1
  },
  {
    "archivo": "regalos/Heart.png",
    "nombre": "Corazòn",
    "descripcion": "Controles congelados",
    "monedas": 10
  },
  {
    "archivo": "regalos/Capybara.png",
    "nombre": "Capibara",
    "descripcion": "Ir a la ronda 50",
    "monedas": 30
  },
  {
    "archivo": "regalos/Doughnut.png",
    "nombre": "Doughnut",
    "descripcion": "Quitar todas las perks",
    "monedas": 30
  },
  {
    "archivo": "regalos/Friendship Necklace.png",
    "nombre": "Friendship Necklace",
    "descripcion": "Ruleta: girar",
    "monedas": 10
  },
  {
    "archivo": "regalos/Divine Fingers.png",
    "nombre": "Dedos Divinos",
    "descripcion": "Saltar a la siguiente ronda",
    "monedas": 6
  },
  {
    "archivo": "regalos/Overreact.png",
    "nombre": "Reaccion Exagerada",
    "descripcion": "Arma especial",
    "monedas": 5
  },
  {
    "archivo": "regalos/It’s corn.png",
    "nombre": "Mazorca",
    "descripcion": "Arma especial",
    "monedas": 1
  }
];

    const contenedor = document.getElementById('contenedor');
    let indiceActual = 0;
    const tiempoVisibilidad = 6000;

    function mostrarSiguienteGrupo() {
      if (!regalos.length) return;
      contenedor.classList.add('oculto');

      setTimeout(() => {
        let grupo = regalos.slice(indiceActual, indiceActual + 3);

        // Si quedan menos de 3 al final de la lista, se completa con otros al azar
        if (grupo.length < 3 && regalos.length > grupo.length) {
          const faltantes = Math.min(3 - grupo.length, regalos.length - grupo.length);
          const disponibles = regalos.filter(r => !grupo.includes(r));
          const aleatorios = disponibles.sort(() => 0.5 - Math.random()).slice(0, faltantes);
          grupo = [...grupo, ...aleatorios];
        }

        contenedor.innerHTML = grupo.map(item => `
          <div class="item">
            <div class="img-box">
              <img src="${encodeURI(item.archivo)}" alt="Regalo">
            </div>
            <div class="info">
              <span class="titulo">${item.nombre}</span>
              <span class="subtitulo">${item.descripcion}</span>
              <div class="precio-box">
                <img src="regalos/moneda_tiktok.png" alt="moneda">
                <span>${item.monedas}</span>
              </div>
            </div>
          </div>
        `).join('');

        contenedor.classList.remove('oculto');

        indiceActual += 3;
        if (indiceActual >= regalos.length) {
          indiceActual = 0;
        }
      }, 500);
    }

    mostrarSiguienteGrupo();
    setInterval(mostrarSiguienteGrupo, tiempoVisibilidad);
  </script>

</body>
</html>
